networks:
  redpanda-network:
    driver: bridge

volumes:
  redpanda-data:

services:
  # ----------------------------------------------------
  # Redpanda Broker (The Core Streaming Engine)
  # ----------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1 # Use the latest stable version
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1                     # Limit CPU cores usage for local dev
      - --memory 1G                 # Limit memory consumption
      - --overprovisioned           # Tells Redpanda it's running in a virtualized/shared dev environment
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"               # Port your local Django app / code will connect to
      - "18082:18082"               # HTTP Proxy port for external REST clients
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - redpanda-network

